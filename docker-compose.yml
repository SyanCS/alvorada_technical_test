version: '3.8'

services:
  # PHP + Apache Web Server
  web:
    build: .
    container_name: alvorada_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - alvorada_network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: alvorada_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - alvorada_network

  # phpMyAdmin for easy database management
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: alvorada_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - alvorada_network

networks:
  alvorada_network:
    driver: bridge

volumes:
  db_data:


